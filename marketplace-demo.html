<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultmark — Marketplace Platform Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241B2F;
  --ink-soft:#2F2440;
  --ink-softer:#3B2E51;
  --paper:#F5F1E6;
  --paper-dim:#E9E0CC;
  --card:#FFFFFF;
  --gold:#B98B4E;
  --gold-deep:#8F6A32;
  --gold-soft:#E7D3A6;
  --teal:#5C8265;
  --teal-soft:#DEE9DC;
  --coral:#B14B3B;
  --coral-soft:#F0DAD0;
  --slate:#675E78;
  --line: rgba(36,27,47,0.11);
  --line-soft: rgba(36,27,47,0.06);
  --white:#FFFFFF;
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold-soft);}

/* ---------- APP SHELL ---------- */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
@media (max-width:860px){#app{grid-template-columns:1fr;}#sidebar{position:fixed;z-index:40;top:0;left:0;bottom:0;transform:translateX(-100%);transition:transform .25s ease;}#sidebar.open{transform:translateX(0);}}

#sidebar{
  background:var(--ink);
  color:#EDEAE0;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  gap:22px;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:#fff;}
.brand-sub{font-size:10.5px;color:#8B8F9C;letter-spacing:.06em;text-transform:uppercase;margin-top:-2px;}

.role-switch{display:flex;background:var(--ink-soft);border-radius:8px;padding:3px;gap:2px;}
.role-switch button{flex:1;border:0;background:transparent;color:#9195A2;font-size:11.5px;font-weight:600;padding:7px 4px;border-radius:6px;transition:all .15s;}
.role-switch button.active{background:var(--gold);color:var(--ink);}

nav.navlist{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:#C6C9D2;font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .12s,color .12s;}
.navlink:hover{background:var(--ink-soft);color:#fff;}
.navlink.active{background:var(--ink-softer);color:#fff;box-shadow:inset 2px 0 0 var(--gold);}
.navlink svg{flex-shrink:0;opacity:.85;}
.navlink .badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}

.side-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;display:flex;gap:10px;align-items:center;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.side-footer .name{font-size:12.5px;font-weight:600;color:#fff;}
.side-footer .role{font-size:10.5px;color:#8B8F9C;text-transform:capitalize;}

/* ---------- MAIN ---------- */
#main{display:flex;flex-direction:column;min-width:0;}
#topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:20;
}
#menuToggle{display:none;border:0;background:transparent;padding:4px;}
@media (max-width:860px){#menuToggle{display:block;}}
.searchbar{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;}
.searchbar input{border:0;outline:0;flex:1;font-size:13.5px;background:transparent;color:var(--ink);}
.searchbar svg{opacity:.5;flex-shrink:0;}
.topbar-spacer{flex:1;}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--card);border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--paper);}
.wallet-chip{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;}
.wallet-chip .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold-soft);}

#content{padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- GENERIC ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:26px;margin:0 0 4px;font-weight:600;}
.page-head p{margin:0;color:var(--slate);font-size:13.5px;}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;transition:all .12s;white-space:nowrap;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-soft);}
.btn-gold{background:var(--gold);color:var(--ink);}
.btn-gold:hover{background:var(--gold-deep);color:#fff;}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{background:var(--paper-dim);}
.btn-teal{background:var(--teal);color:#fff;}
.btn-coral{background:var(--coral);color:#fff;}
.btn-ghost{background:transparent;color:var(--slate);border-color:transparent;padding:8px 10px;}
.btn-ghost:hover{background:var(--paper-dim);color:var(--ink);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em;}
.pill-active{background:var(--teal-soft);color:var(--teal);}
.pill-draft{background:var(--paper-dim);color:var(--slate);}
.pill-pending{background:var(--gold-soft);color:var(--gold-deep);}
.pill-danger{background:var(--coral-soft);color:var(--coral);}
.pill-info{background:#DCE6F3;color:#2D5A97;}

.empty{text-align:center;padding:60px 20px;color:var(--slate);}
.empty h3{font-size:16px;margin:14px 0 6px;color:var(--ink);}
.empty p{font-size:13px;margin:0 0 16px;}

/* ---------- GRID / PRODUCT CARDS ---------- */
.filter-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--slate);}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.select-sm{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--ink);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.pcard{overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s;}
.pcard:hover{box-shadow:0 8px 22px rgba(36,27,47,.10);transform:translateY(-2px);}
.pimg{height:140px;position:relative;cursor:pointer;overflow:hidden;background:var(--paper-dim);}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
.pcard:hover .pimg img{transform:scale(1.05);}
.pimg .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;border:0;z-index:2;}
.pimg .fav svg{stroke:var(--ink);}
.pimg .fav.faved svg{fill:var(--coral);stroke:var(--coral);}
.pbody{padding:12px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
.pbody .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-deep);font-weight:700;}
.pbody .title{font-size:14px;font-weight:600;cursor:pointer;line-height:1.3;}
.pbody .title:hover{text-decoration:underline;}
.pbody .meta{font-size:12px;color:var(--slate);}
.pbody .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px;}
.pbody .price{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}

/* ---------- PRODUCT DETAIL ---------- */
.pd-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;}
@media (max-width:760px){.pd-wrap{grid-template-columns:1fr;}}
.pd-hero{height:340px;border-radius:14px;position:relative;overflow:hidden;background:var(--paper-dim);}
.pd-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;}
.pd-thumbs div{width:54px;height:54px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--paper-dim);}
.pd-thumbs div img{width:100%;height:100%;object-fit:cover;display:block;}
.pd-thumbs div.active{border-color:var(--gold);}
.seller-row{display:flex;align-items:center;gap:10px;margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:10px;}
.seller-row .info{flex:1;}
.seller-row .sname{font-weight:600;font-size:13.5px;}
.seller-row .srating{font-size:12px;color:var(--slate);display:flex;align-items:center;gap:4px;}
.pd-price-row{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;}
.pd-price-row .price{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;}
.pd-actions{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;}
.trust-strip{display:flex;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap;}
.trust-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--slate);}
.trust-item svg{color:var(--teal);flex-shrink:0;}

/* ---------- VAULT / ESCROW SIGNATURE ---------- */
.vault{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--ink) 0%, var(--ink-soft) 100%);color:#fff;padding:22px 24px;position:relative;overflow:hidden;}
.vault-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 3px;color:#fff;}
.vault-sub{font-size:12px;color:#9195A2;margin:0 0 18px;}
.vault-track{display:flex;align-items:center;gap:0;position:relative;}
.vault-node{display:flex;flex-direction:column;align-items:center;gap:8px;width:84px;flex-shrink:0;}
.vault-node .circ{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink-softer);border:1.5px solid rgba(255,255,255,.15);}
.vault-node.done .circ{background:var(--teal);border-color:var(--teal);}
.vault-node.current .circ{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px rgba(201,151,61,.22);}
.vault-node .lbl{font-size:11px;color:#C6C9D2;text-align:center;font-weight:600;}
.vault-node .amt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);}
.vault-line{flex:1;height:2px;background:rgba(255,255,255,.14);position:relative;top:-19px;margin:0 -4px;}
.vault-line.filled{background:var(--teal);}

/* ---------- FORMS ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.field .hint{font-size:11px;color:var(--slate);margin-top:4px;}
input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;background:var(--card);color:var(--ink);outline:0;
}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,151,61,.15);}
textarea{resize:vertical;min-height:80px;}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--slate);font-size:12.5px;}
.upload-box svg{margin-bottom:6px;opacity:.5;}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
.tbl-wrap{overflow-x:auto;}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
.tab{border:0;background:transparent;padding:10px 14px;font-size:13px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--ink);border-color:var(--gold);}

/* ---------- MESSAGING ---------- */
.msg-wrap{display:grid;grid-template-columns:270px 1fr;height:560px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
@media (max-width:760px){.msg-wrap{grid-template-columns:1fr;height:auto;}}
.conv-list{border-right:1px solid var(--line);overflow-y:auto;}
.conv-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
.conv-item:hover,.conv-item.active{background:var(--paper-dim);}
.conv-item .cname{font-size:13px;font-weight:600;}
.conv-item .cprod{font-size:11.5px;color:var(--slate);}
.conv-item .clast{font-size:11.5px;color:var(--slate);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-col{display:flex;flex-direction:column;}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.bubble{max-width:70%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px;}
.bubble.them{align-self:flex-start;background:var(--paper-dim);color:var(--ink);border-bottom-left-radius:4px;}
.bubble .t{display:block;font-size:10px;opacity:.6;margin-top:3px;}
.chat-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);}
.chat-input input{flex:1;}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(36,27,47,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--card);border-radius:14px;max-width:460px;width:100%;padding:24px;max-height:88vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-close{border:0;background:transparent;padding:4px;color:var(--slate);}

/* ---------- TOAST ---------- */
#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:toastin .2s ease;}
.toast svg{color:var(--gold-soft);flex-shrink:0;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- MISC ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{padding:16px 18px;}
.stat-card .lbl{font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.stat-card .val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:6px;}
.stat-card .sub{font-size:11.5px;color:var(--slate);margin-top:3px;}
.section-title{font-size:15px;font-weight:600;margin:0 0 4px;}
.divider{height:1px;background:var(--line);margin:22px 0;}
.star-row{display:flex;gap:3px;}
.star-row svg{cursor:pointer;}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
.list-row:last-child{border-bottom:0;}
.list-row .grow{flex:1;min-width:0;}
.list-row .ttl{font-size:13.5px;font-weight:600;}
.list-row .sub{font-size:12px;color:var(--slate);margin-top:2px;}
.timeline{border-left:2px solid var(--line);padding-left:16px;margin-left:6px;}
.timeline .tstep{position:relative;padding-bottom:16px;}
.timeline .tstep:last-child{padding-bottom:0;}
.timeline .tstep::before{content:'';position:absolute;left:-21px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--line);}
.timeline .tstep.done::before{background:var(--teal);}
.timeline .tstep .tt{font-size:13px;font-weight:600;}
.timeline .tstep .td{font-size:11.5px;color:var(--slate);}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <div id="topbar"></div>
    <div id="content"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-wrap"></div>

<script>
/* =========================================================
   ICONS — minimal hand-built feather-style icon set
========================================================= */
function ic(name,size){
  size=size||18;
  const s='width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const paths={
    search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    wallet:'<path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Z"/><path d="M16 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><circle cx="16" cy="13" r="1.4"/>',
    box:'<path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
    chat:'<path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-4.5A8.5 8.5 0 1 1 21 11.5Z"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
    shield:'<path d="M12 3 4 6v6c0 5 3.4 8.2 8 9 4.6-.8 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    star:'<polygon points="12 2 15.1 8.6 22 9.3 17 14.1 18.4 21 12 17.6 5.6 21 7 14.1 2 9.3 8.9 8.6"/>',
    check:'<polyline points="20 6 9 17 4 12"/>',
    x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/>',
    truck:'<rect x="1" y="6" width="14" height="11" rx="1"/><path d="M15 9h4l3 3v5h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/>',
    lock:'<rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',

function idxr(id){return products.find(p=>p.id===id);}
function fmt(n){return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function toast(msg,icon){
  icon = icon||'check';
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = ic(icon,16)+'<span>'+esc(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),250);},2600);
}

function setRole(r){
  state.role=r;
  state.view = r==='admin' ? 'admin' : 'browse';
  render();
}
function setView(v,arg){
  state.view=v;
  if(v==='product'){state.selectedProductId=arg;state.activePimg=0;}
  if(v==='messages' && arg){state.activeConv=arg;}
  if(v==='admin' && arg){state.adminTab=arg;}
  window.scrollTo(0,0);
  render();
}
function closeModal(){state.modal=null;renderModal();}
function openModal(m){state.modal=m;renderModal();}

function toggleFavorite(id,ev){
  if(ev) ev.stopPropagation();
  const p=idxr(id); p.faved=!p.faved; p.favorites += p.faved?1:-1;
  toast(p.faved?'Added to favourites':'Removed from favourites','heart');
  render();
}

function submitOffer(productId,amount){
  const p=idxr(productId);
  if(!amount || amount<=0){toast('Enter a valid offer amount','alert');return;}
  offers.unshift({id:Date.now(),productId:productId,buyer:CURRENT_USER.name,buyerId:'u1',seller:p.seller,sellerId:p.sellerId,listPrice:p.price,amount:Number(amount),status:'pending',time:'Just now'});
  closeModal();
  toast('Offer of '+fmt(amount)+' sent to '+p.seller,'tag');
  setView('offers');
}
function acceptOffer(id){
  const o=offers.find(x=>x.id===id); o.status='accepted';
  toast('Offer accepted — buyer can now check out','check');
  // create a pending order shell
  render();
}
function rejectOffer(id){
  const o=offers.find(x=>x.id===id); o.status='rejected';
  toast('Offer declined');
  render();
}
function counterOffer(id,amount){
  const o=offers.find(x=>x.id===id);
  if(!amount||amount<=0){toast('Enter a valid counter amount','alert');return;}
  o.amount=Number(amount); o.status='countered'; o.time='Just now';
  toast('Counter-offer of '+fmt(amount)+' sent','tag');
  render();
}

function openMessageModal(sellerName,sellerId,productId,productTitle){
  let conv = conversations.find(c=>c.productId===productId);
  if(!conv){
    conv = {id:Date.now(),withName:sellerName,withInitials:sellerName.split(' ').map(w=>w[0]).join(''),productId:productId,productTitle:productTitle,messages:[]};
    conversations.unshift(conv);
  }
  setView('messages',conv.id);
}
function sendMessage(text){
  if(!text.trim())return;
  const conv = conversations.find(c=>c.id===state.activeConv);
  conv.messages.push({from:'me',text:text,time:'Just now'});
  document.getElementById('chatInputBox').value='';
  render();
  setTimeout(()=>{
    conv.messages.push({from:'them',text:'Thanks for the message — I\'ll get back to you shortly!',time:'Just now'});
    render();
  },1100);
}

function buyNow(productId){
  const p = idxr(productId);
  openModal({type:'checkout',productId:productId,step:1});
}
function confirmCheckout(productId){
  const p = idxr(productId);
  const commission = +(p.price*0.05).toFixed(2);
  const order = {id:'ORD-'+Math.floor(1000+Math.random()*9000),productId:p.id,title:p.title,buyer:CURRENT_USER.name,buyerId:'u1',seller:p.seller,sellerId:p.sellerId,amount:p.price,commission:commission,status:'escrow_held',tracking:null,created:'Just now',role:'buyer'};
  orders.unshift(order);
  notifications.unshift({id:Date.now(),icon:'shield',text:'Payment of '+fmt(p.price)+' secured in escrow for '+p.title,time:'Just now',read:false});
  closeModal();
  toast('Payment secured in escrow — seller notified','lock');
  setView('orders');
}
function markShipped(orderId,tracking){
  const o = orders.find(x=>x.id===orderId);
  o.status='shipped'; o.tracking = tracking||('TRK'+Math.floor(Math.random()*900000000));
  toast('Order marked as shipped');
  render();
}
function confirmDelivery(orderId){
  const o = orders.find(x=>x.id===orderId);
  o.status='completed';
  CURRENT_USER.walletBalance += (o.amount - o.commission);
  notifications.unshift({id:Date.now(),icon:'wallet',text:'Funds released: '+fmt(o.amount-o.commission)+' from order '+o.id,time:'Just now',read:false});
  toast('Delivery confirmed — funds released from escrow','check');
  render();
}
function openDisputeModal(orderId){
  openModal({type:'dispute',orderId:orderId});
}
function fileDispute(orderId,reason){
  if(!reason.trim()){toast('Please describe the issue','alert');return;}
  const o = orders.find(x=>x.id===orderId);
  o.status='disputed';
  disputes.unshift({orderId:orderId,product:o.title,buyer:o.buyer,seller:o.seller,amount:o.amount,reason:reason,status:'open',opened:'Just now'});
  closeModal();
  toast('Dispute filed — our team will review the evidence','gavel');
  render();
}
function cancelOrder(orderId){
  const o = orders.find(x=>x.id===orderId);
  o.status='cancelled';
  toast('Order cancelled and refund initiated');
  render();
}

function requestPayout(){
  if(CURRENT_USER.walletBalance<=0){toast('No available balance to withdraw','alert');return;}
  const amt = CURRENT_USER.walletBalance;
  payoutHistory.unshift({id:'PO-'+Math.floor(300+Math.random()*99),amount:amt,date:'Just now',status:'Processing'});
  CURRENT_USER.walletBalance = 0;
  closeModal();
  toast('Payout of '+fmt(amt)+' requested','wallet');
  render();
}

function submitReview(orderId,rating,text){
  if(!rating){toast('Please select a star rating','alert');return;}
  const o = orders.find(x=>x.id===orderId);
  o.reviewed = true;
  reviews.unshift({orderId:orderId,rating:rating,text:text,from:CURRENT_USER.name,product:o.title});
  closeModal();
  toast('Review submitted — thanks for your feedback','star');
  render();
}

function resolveDispute(orderId,decision){
  const d = disputes.find(x=>x.orderId===orderId); d.status = decision==='release'?'resolved — released to seller':'resolved — refunded to buyer';
  const o = orders.find(x=>x.id===orderId); if(o) o.status = decision==='release'?'completed':'refunded';
  toast('Dispute resolved: '+(decision==='release'?'funds released to seller':'buyer refunded'));
  render();
}

function navItemsFor(role){
  const common = [
    {v:'browse',label:'Browse',icon:'search'},
    {v:'offers',label:'Offers',icon:'tag',badge:offers.filter(o=>o.status==='pending'&&o.sellerId==='u1').length},
    {v:'messages',label:'Messages',icon:'chat'},
    {v:'orders',label:'Orders',icon:'box'},
    {v:'wallet',label:'Wallet & Payouts',icon:'wallet'},
    {v:'notifications',label:'Notifications',icon:'bell',badge:notifications.filter(n=>!n.read).length},
    {v:'profile',label:'Profile',icon:'user'}
  ];
  if(role==='seller'){
    return [{v:'browse',label:'Browse',icon:'search'},{v:'mylistings',label:'My Listings',icon:'box'}].concat(common.slice(1));
  }
  if(role==='admin'){
    return [
      {v:'admin',arg:'users',label:'Users',icon:'user'},
      {v:'admin',arg:'listings',label:'Listings',icon:'box'},
      {v:'admin',arg:'orders',label:'Orders & Escrow',icon:'shield'},
      {v:'admin',arg:'disputes',label:'Disputes',icon:'gavel',badge:disputes.filter(d=>d.status==='open').length},
      {v:'admin',arg:'flags',label:'Reported Listings',icon:'alert',badge:flaggedListings.length},
      {v:'admin',arg:'commissions',label:'Commissions',icon:'settings'},
      {v:'admin',arg:'coupons',label:'Coupons',icon:'tag'}
    ];
  }
  return common;
}

========================================================= */
function renderTopbar(){
  const unread = notifications.filter(n=>!n.read).length;
  const tb = document.getElementById('topbar');
  tb.innerHTML = `
    <button id="menuToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">${ic('menu',20)}</button>
    <div class="searchbar">
      ${ic('search',16)}
      <input type="text" placeholder="Search listings, categories, sellers…" value="${esc(state.search)}" oninput="state.search=this.value; renderContentOnly();">
    </div>
    <div class="topbar-spacer"></div>
    <div class="wallet-chip">${ic('wallet',15)}<span>Balance</span><span class="amt">${fmt(CURRENT_USER.walletBalance)}</span></div>
    <button class="icon-btn" onclick="setView('notifications')" title="Notifications">${ic('bell',17)}${unread?'<span class="dot"></span>':''}</button>
  `;
}

/* =========================================================
   RENDER: BROWSE
========================================================= */
function filteredProducts(){
  let list = products.filter(p=> state.role==='admin' ? true : p.status==='active' || p.sellerId==='u1');
  if(state.role!=='admin'){
    // buyers/sellers browsing marketplace should mainly see active items (plus their own drafts on My Listings, handled separately)
    list = products.filter(p=>p.status==='active');
  }
  if(state.category!=='All') list = list.filter(p=>p.category===state.category);
  if(state.search.trim()) list = list.filter(p=>p.title.toLowerCase().includes(state.search.toLowerCase())||p.category.toLowerCase().includes(state.search.toLowerCase()));
  if(state.sort==='price_low') list=[...list].sort((a,b)=>a.price-b.price);
  if(state.sort==='price_high') list=[...list].sort((a,b)=>b.price-a.price);
  if(state.sort==='popular') list=[...list].sort((a,b)=>b.favorites-a.favorites);
  return list;
}

function productCard(p){
  return `
  <div class="card pcard">
    <div class="pimg" onclick="setView('product',${p.id})">
      <img src="${p.img}" alt="${esc(p.title)}" loading="lazy">
      <button class="fav ${p.faved?'faved':''}" onclick="toggleFavorite(${p.id},event)">${ic('heart',15)}</button>
    </div>
    <div class="pbody">
      <div class="cat">${p.category}</div>
      <div class="title" onclick="setView('product',${p.id})">${esc(p.title)}</div>
      <div class="meta">${p.condition} · ${p.seller}</div>
      <div class="bottom">
        <div class="price">${fmt(p.price)}</div>
        <div style="font-size:11.5px;color:var(--slate);display:flex;align-items:center;gap:3px;">${ic('heart',12)} ${p.favorites}</div>
      </div>
    </div>
  </div>`;
}

function viewBrowse(){
  const cats = ['All','Electronics','Fashion','Home & Living','Collectibles','Sports'];
  const list = filteredProducts();
  return `
    <div class="page-head">
      <div><h1>Browse the marketplace</h1><p>${list.length} listing${list.length!==1?'s':''} available right now</p></div>
      ${state.role==='seller' ? `<button class="btn btn-gold" onclick="openListingModal()">${ic('plus',15)} Create listing</button>`:''}
    </div>
    <div class="filter-row">
      ${cats.map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="state.category='${c}';renderContentOnly();">${c}</button>`).join('')}
      <div style="margin-left:auto;">
        <select class="select-sm" onchange="state.sort=this.value;renderContentOnly();">
          <option value="relevance" ${state.sort==='relevance'?'selected':''}>Sort: Relevance</option>
          <option value="price_low" ${state.sort==='price_low'?'selected':''}>Price: Low to High</option>
          <option value="price_high" ${state.sort==='price_high'?'selected':''}>Price: High to Low</option>
          <option value="popular" ${state.sort==='popular'?'selected':''}>Most Favourited</option>
        </select>
      </div>
    </div>
    ${list.length? `<div class="grid">${list.map(productCard).join('')}</div>` :
      `<div class="empty">${ic('search',30)}<h3>No listings match your filters</h3><p>Try a different category or clear your search.</p></div>`}
  `;
}

/* =========================================================
   RENDER: OFFERS
========================================================= */
function viewOffers(){
  const mine = offers.filter(o=>o.buyerId==='u1' || o.sellerId==='u1');
  const received = mine.filter(o=>o.sellerId==='u1');
  const sent = mine.filter(o=>o.buyerId==='u1');
  function row(o,mode){
    const p = idxr(o.productId);
    const statusPill = {pending:'pill-pending',accepted:'pill-active',rejected:'pill-danger',countered:'pill-info'}[o.status]||'pill-draft';
    return `
    <div class="card" style="padding:14px 16px;margin-bottom:10px;">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div style="width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--paper-dim);">${p?`<img src="${p.img}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover;display:block;">`:''}</div>
        <div style="flex:1;min-width:180px;">
          <div style="font-weight:600;font-size:13.5px;">${o.productTitle||(p?p.title:'Listing removed')}</div>
          <div style="font-size:12px;color:var(--slate);">${mode==='received'?'From '+o.buyer:'To '+o.seller} · List price ${fmt(o.listPrice)} · ${o.time}</div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-weight:600;font-size:16px;">${fmt(o.amount)}</div>
          <span class="pill ${statusPill}">${o.status}</span>
        </div>
      </div>
      ${mode==='received' && o.status==='pending' ? `
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <button class="btn btn-teal btn-sm" onclick="acceptOffer(${o.id})">${ic('check',13)} Accept</button>
          <button class="btn btn-coral btn-sm" onclick="rejectOffer(${o.id})">${ic('x',13)} Reject</button>
          <input type="number" placeholder="Counter $" id="counter-${o.id}" style="width:100px;padding:6px 8px;font-size:12.5px;">
          <button class="btn btn-outline btn-sm" onclick="counterOffer(${o.id}, document.getElementById('counter-${o.id}').value)">Send counter</button>
        </div>`:''}
      ${mode==='sent' && o.status==='accepted' ? `
        <div style="margin-top:12px;"><button class="btn btn-gold btn-sm" onclick="setView('product',${o.productId})">${ic('shield',13)} Proceed to escrow checkout</button></div>`:''}
      ${mode==='sent' && o.status==='countered' ? `
        <div style="margin-top:12px;font-size:12.5px;color:var(--slate);">${ic('info',13)} Seller countered — check messages to continue negotiating.</div>`:''}
    </div>`;
  }
  return `
    <div class="page-head"><div><h1>Offers & negotiation</h1><p>Track offers you've sent and manage offers you've received</p></div></div>
    <div class="tabs">
      <button class="tab ${state._offersTab!=='sent'?'active':''}" onclick="state._offersTab='received';renderContentOnly();">Received (${received.length})</button>
      <button class="tab ${state._offersTab==='sent'?'active':''}" onclick="state._offersTab='sent';renderContentOnly();">Sent (${sent.length})</button>
    </div>
    ${state._offersTab==='sent' ?
      (sent.length? sent.map(o=>row(o,'sent')).join('') : `<div class="empty">${ic('tag',28)}<h3>No offers sent yet</h3><p>Browse listings and make an offer to a seller.</p></div>`)
      :
      (received.length? received.map(o=>row(o,'received')).join('') : `<div class="empty">${ic('tag',28)}<h3>No offers received yet</h3><p>Offers on your listings will appear here.</p></div>`)
    }
  `;
}

            <div style="min-width:0;">
              <div class="cname">${c.withName}</div>
              <div class="cprod">${esc(c.productTitle)}</div>
              <div class="clast">${c.messages.length?esc(c.messages[c.messages.length-1].text):'No messages yet'}</div>

          ${conv.messages.length? conv.messages.map(m=>`<div class="bubble ${m.from==='me'?'me':'them'}">${esc(m.text)}<span class="t">${m.time}</span></div>`).join('') : `<div class="empty" style="padding:30px;">Say hello to start the conversation.</div>`}

        </div>` : `<div class="empty">No conversation selected</div>`}
      </div>
    </div>
  `;
}

/* =========================================================
   RENDER: ORDERS
========================================================= */
function statusMeta(status){
  return {
    escrow_held:{label:'Escrow held',pill:'pill-pending',icon:'lock'},
    shipped:{label:'Shipped',pill:'pill-info',icon:'truck'},
    completed:{label:'Completed',pill:'pill-active',icon:'check'},
    disputed:{label:'Disputed',pill:'pill-danger',icon:'gavel'},
    cancelled:{label:'Cancelled',pill:'pill-draft',icon:'x'},
    refunded:{label:'Refunded',pill:'pill-draft',icon:'wallet'}
  }[status] || {label:status,pill:'pill-draft',icon:'box'};
}
function vaultWidget(order){
  const stage = {escrow_held:1,shipped:1,completed:2,disputed:1,cancelled:0,refunded:0}[order.status] ?? 1;
  const node = (n,label,amt,active,done)=>`
    <div class="vault-node ${done?'done':active?'current':''}">
      <div class="circ">${ic(done?'check':n,18)}</div>
      <div class="lbl">${label}</div>
      <div class="amt">${amt}</div>
    </div>`;
  return `
  <div class="vault">
    <div class="vault-title">${ic('shield',15)} Escrow status</div>
    <div class="vault-sub">Funds move safely from buyer to seller, held by Vaultmark until delivery is confirmed</div>
    <div class="vault-track">
      ${node('user','Buyer',fmt(order.amount),stage===0,stage>0)}
      <div class="vault-line ${stage>=1?'filled':''}"></div>
      ${node('lock','Escrow vault',fmt(order.amount),stage===1,stage>1)}
      <div class="vault-line ${stage>=2?'filled':''}"></div>
      ${node('user','Seller',fmt(+(order.amount-order.commission).toFixed(2)),stage===2,stage>2)}
    </div>
  </div>`;
}
function orderCard(o){
  const meta = statusMeta(o.status);
  const asSeller = o.sellerId==='u1';
  const asBuyer = o.buyerId==='u1';
  return `
  <div class="card" style="padding:18px 20px;margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-size:12px;color:var(--slate);" class="mono">${o.id} · ${o.created}</div>
        <div style="font-weight:600;font-size:14.5px;margin-top:2px;">${esc(o.title)}</div>
        <div style="font-size:12px;color:var(--slate);margin-top:2px;">${asBuyer?'Sold by '+o.seller:'Sold to '+o.buyer}</div>
      </div>
      <div style="text-align:right;">
        <div class="mono" style="font-weight:600;font-size:16px;">${fmt(o.amount)}</div>
        <span class="pill ${meta.pill}">${ic(meta.icon,11)} ${meta.label}</span>
      </div>
    </div>
    ${['escrow_held','shipped','completed'].includes(o.status)? vaultWidget(o):''}
    ${o.tracking? `<div style="font-size:12.5px;color:var(--slate);margin-top:10px;">${ic('truck',13)} Tracking: <span class="mono">${o.tracking}</span></div>`:''}
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      ${asSeller && o.status==='escrow_held' ? `<button class="btn btn-primary btn-sm" onclick="markShipped('${o.id}')">${ic('truck',13)} Mark as shipped</button>`:''}
      ${asBuyer && o.status==='shipped' ? `<button class="btn btn-teal btn-sm" onclick="confirmDelivery('${o.id}')">${ic('check',13)} Confirm delivery — release funds</button>`:''}
      ${asBuyer && ['shipped','escrow_held'].includes(o.status) ? `<button class="btn btn-outline btn-sm" onclick="openDisputeModal('${o.id}')">${ic('gavel',13)} Open dispute</button>`:''}
      ${asBuyer && o.status==='escrow_held' ? `<button class="btn btn-ghost btn-sm" onclick="cancelOrder('${o.id}')">${ic('x',13)} Cancel order</button>`:''}
      ${asBuyer && o.status==='completed' && !o.reviewed ? `<button class="btn btn-gold btn-sm" onclick="openReviewModal('${o.id}')">${ic('star',13)} Leave a review</button>`:''}
      ${o.reviewed ? `<span class="pill pill-active">${ic('star',11)} Reviewed</span>`:''}
    </div>
  </div>`;
}
function viewOrders(){
  const mine = orders.filter(o=>o.buyerId==='u1'||o.sellerId==='u1');
  return `
    <div class="page-head"><div><h1>Orders & shipping</h1><p>Full order lifecycle, from escrow hold to delivery confirmation</p></div></div>
    ${mine.length? mine.map(orderCard).join('') : `<div class="empty">${ic('box',28)}<h3>No orders yet</h3></div>`}
  `;
}

========================================================= */
function viewMyListings(){
  const mine = products.filter(p=>p.sellerId==='u1');
  return `
    <div class="page-head">
      <div><h1>My listings</h1><p>Create, edit, publish, archive or remove your products</p></div>
      <button class="btn btn-gold" onclick="openListingModal()">${ic('plus',15)} Create listing</button>
    </div>
    ${mine.length? `<div class="tbl-wrap card" style="padding:6px 10px;"><table>
      <tr><th>Listing</th><th>Price</th><th>Status</th><th>Favourites</th><th></th></tr>
      ${mine.map(p=>`
        <tr>
          <td style="display:flex;align-items:center;gap:10px;"><div style="width:34px;height:34px;border-radius:7px;overflow:hidden;background:var(--paper-dim);"><img src="${p.img}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>${esc(p.title)}</td>
          <td class="mono">${fmt(p.price)}</td>
          <td><span class="pill ${p.status==='active'?'pill-active':p.status==='draft'?'pill-draft':'pill-danger'}">${p.status}</span></td>
          <td>${p.favorites}</td>
          <td style="text-align:right;white-space:nowrap;">
            ${p.status==='draft'?`<button class="btn btn-ghost btn-sm" onclick="activateListing(${p.id})" title="Publish">${ic('check',14)}</button>`:''}
            ${p.status==='active'?`<button class="btn btn-ghost btn-sm" onclick="archiveListing(${p.id})" title="Archive">${ic('box',14)}</button>`:''}
            <button class="btn btn-ghost btn-sm" onclick="setView('product',${p.id})" title="View">${ic('search',14)}</button>
            <button class="btn btn-ghost btn-sm" onclick="deleteListing(${p.id})" title="Delete">${ic('trash',14)}</button>
          </td>
        </tr>`).join('')}
    </table></div>` : `<div class="empty">${ic('box',28)}<h3>You haven't listed anything yet</h3><p>Create your first listing to start selling.</p></div>`}
  `;
}

/* =========================================================
   RENDER: ADMIN PORTAL
========================================================= */
function adminTabs(){
  const tabs = [['users','Users'],['listings','Listings'],['orders','Orders & Escrow'],['disputes','Disputes'],['flags','Reported Listings'],['commissions','Commissions'],['coupons','Coupons']];
  return `<div class="tabs">${tabs.map(t=>`<button class="tab ${state.adminTab===t[0]?'active':''}" onclick="setView('admin','${t[0]}')">${t[1]}</button>`).join('')}</div>`;
}
function viewAdmin(){
  let body='';
  if(state.adminTab==='users'){
    body = `<div class="tbl-wrap card" style="padding:6px 10px;"><table>
      <tr><th>User</th><th>Email</th><th>Role</th><th>Verified</th><th>Status</th><th></th></tr>
      ${adminUsers.map(u=>`
        <tr>
          <td style="font-weight:600;">${u.name}</td><td>${u.email}</td><td>${u.role}</td>
          <td>${u.verified?`<span class="pill pill-active">${ic('check',10)} Verified</span>`:'<span class="pill pill-draft">Unverified</span>'}</td>
          <td><span class="pill ${u.status==='active'?'pill-active':'pill-danger'}">${u.status}</span></td>
          <td style="text-align:right;">${u.status==='active'?`<button class="btn btn-coral btn-sm" onclick="suspendUser('${u.id}')">Suspend</button>`:`<button class="btn btn-teal btn-sm" onclick="activateUser('${u.id}')">Reactivate</button>`}</td>
        </tr>`).join('')}
    </table></div>`;
  } else if(state.adminTab==='listings'){
    body = `<div class="tbl-wrap card" style="padding:6px 10px;"><table>
      <tr><th>Listing</th><th>Seller</th><th>Price</th><th>Status</th><th></th></tr>
      ${products.map(p=>`
        <tr>
          <td style="display:flex;align-items:center;gap:10px;"><div style="width:30px;height:30px;border-radius:6px;overflow:hidden;background:var(--paper-dim);"><img src="${p.img}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>${esc(p.title)}</td>
          <td>${p.seller}</td><td class="mono">${fmt(p.price)}</td>
          <td><span class="pill ${p.status==='active'?'pill-active':p.status==='draft'?'pill-draft':'pill-danger'}">${p.status}</span></td>
          <td style="text-align:right;">
            ${p.status!=='archived'?`<button class="btn btn-ghost btn-sm" onclick="archiveListing(${p.id})">Remove</button>`:`<button class="btn btn-ghost btn-sm" onclick="activateListing(${p.id})">Restore</button>`}
          </td>
        </tr>`).join('')}
    </table></div>`;
  } else if(state.adminTab==='orders'){
    body = `<div class="tbl-wrap card" style="padding:6px 10px;"><table>
      <tr><th>Order</th><th>Buyer</th><th>Seller</th><th>Amount</th><th>Commission</th><th>Status</th></tr>
      ${orders.map(o=>{const m=statusMeta(o.status);return `<tr><td class="mono">${o.id}</td><td>${o.buyer}</td><td>${o.seller}</td><td class="mono">${fmt(o.amount)}</td><td class="mono">${fmt(o.commission)}</td><td><span class="pill ${m.pill}">${m.label}</span></td></tr>`;}).join('')}
    </table></div>`;
  } else if(state.adminTab==='disputes'){
    body = disputes.length ? disputes.map(d=>`
      <div class="card" style="padding:18px 20px;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <div>
            <div class="mono" style="font-size:12px;color:var(--slate);">${d.orderId} · opened ${d.opened}</div>
            <div style="font-weight:600;font-size:14.5px;">${esc(d.product)}</div>
            <div style="font-size:12.5px;color:var(--slate);">Buyer: ${d.buyer} · Seller: ${d.seller}</div>
          </div>
          <div style="text-align:right;">
            <div class="mono" style="font-weight:600;">${fmt(d.amount)}</div>
            <span class="pill ${d.status==='open'?'pill-danger':'pill-active'}">${d.status}</span>
          </div>
        </div>
        <div style="font-size:13px;margin-top:10px;padding:10px 12px;background:var(--paper-dim);border-radius:8px;">${ic('alert',13)} ${esc(d.reason)}</div>
        ${d.status==='open'?`
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn btn-teal btn-sm" onclick="resolveDispute('${d.orderId}','release')">${ic('check',13)} Release funds to seller</button>
          <button class="btn btn-coral btn-sm" onclick="resolveDispute('${d.orderId}','refund')">${ic('wallet',13)} Refund buyer</button>
        </div>`:''}
      </div>`).join('') : `<div class="empty">${ic('gavel',28)}<h3>No open disputes</h3><p>All escrow transactions are running smoothly.</p></div>`;
  } else if(state.adminTab==='flags'){
    body = flaggedListings.length? flaggedListings.map(f=>`
      <div class="card" style="padding:16px 20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div><div style="font-weight:600;font-size:13.5px;">${esc(f.title)}</div><div style="font-size:12px;color:var(--slate);">${ic('alert',12)} ${esc(f.reason)} · reported ${f.reportedBy}x</div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="dismissFlag(${f.id})">Dismiss</button>
          <button class="btn btn-coral btn-sm" onclick="removeFlagged(${f.id})">Remove listing</button>
        </div>
      </div>`).join('') : `<div class="empty">${ic('shield',28)}<h3>No reported listings</h3></div>`;
  } else if(state.adminTab==='commissions'){
    body = `<div class="card" style="padding:20px;max-width:420px;">
      <div class="section-title">Platform commission</div>
      <div style="font-size:12.5px;color:var(--slate);margin-bottom:14px;">Percentage deducted from each completed transaction before releasing funds to the seller.</div>
      <div class="field"><label>Commission rate</label><input type="number" id="commInput" value="${commissionRate}" min="0" max="30"></div>
      <button class="btn btn-primary" onclick="updateCommission(document.getElementById('commInput').value)">Update rate</button>
    </div>`;
  } else if(state.adminTab==='coupons'){
    body = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;"><button class="btn btn-gold btn-sm" onclick="openModal({type:'coupon'})">${ic('plus',13)} New coupon</button></div>
      <div class="tbl-wrap card" style="padding:6px 10px;"><table>
        <tr><th>Code</th><th>Type</th><th>Uses</th><th>Status</th><th></th></tr>
        ${coupons.map(c=>`<tr><td class="mono">${c.code}</td><td>${c.type}</td><td>${c.uses}</td><td><span class="pill ${c.active?'pill-active':'pill-draft'}">${c.active?'Active':'Disabled'}</span></td><td style="text-align:right;"><button class="btn btn-ghost btn-sm" onclick="toggleCoupon('${c.code}')">${c.active?'Disable':'Enable'}</button></td></tr>`).join('')}
      </table></div>`;
  }
  return `
    <div class="page-head"><div><h1>Admin portal</h1><p>Centralized administration for users, listings, escrow, disputes and platform settings</p></div></div>
    <div class="stat-grid">
      <div class="card stat-card"><div class="lbl">Active listings</div><div class="val">${products.filter(p=>p.status==='active').length}</div></div>
      <div class="card stat-card"><div class="lbl">Escrow in holding</div><div class="val">${fmt(orders.filter(o=>o.status==='escrow_held').reduce((s,o)=>s+o.amount,0))}</div></div>
      <div class="card stat-card"><div class="lbl">Open disputes</div><div class="val">${disputes.filter(d=>d.status==='open').length}</div></div>
      <div class="card stat-card"><div class="lbl">Commission earned</div><div class="val">${fmt(orders.reduce((s,o)=>s+o.commission,0))}</div></div>
    </div>
    ${adminTabs()}
    ${body}
  `;
}

/* =========================================================
   MODALS
========================================================= */
function openOfferModal(productId){ openModal({type:'offer',productId:productId}); }
function openListingModal(){ openModal({type:'listing'}); }
function openReviewModal(orderId){ openModal({type:'review',orderId:orderId,rating:0}); }

function renderModal(){
  const root = document.getElementById('modal-root');
  const m = state.modal;
  if(!m){root.innerHTML='';return;}
  let inner='';
  if(m.type==='offer'){
    const p = idxr(m.productId);
    inner = `
      <div class="modal-head"><h3>Make an offer</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;padding:10px;background:var(--paper-dim);border-radius:8px;">
        <div style="width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--paper-dim);"><img src="${p.img}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
        <div><div style="font-weight:600;font-size:13.5px;">${esc(p.title)}</div><div style="font-size:12px;color:var(--slate);">Listed at ${fmt(p.price)}</div></div>
      </div>
      <div class="field"><label>Your offer amount (USD)</label><input type="number" id="offerAmt" placeholder="e.g. ${Math.round(p.price*0.85)}"></div>
      <div class="field"><label>Message to seller (optional)</label><textarea id="offerMsg" placeholder="Add context for your offer…"></textarea></div>
      <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="submitOffer(${p.id}, document.getElementById('offerAmt').value)">Send offer</button>
    `;
  } else if(m.type==='checkout'){
    const p = idxr(m.productId);
    const commission = +(p.price*0.05).toFixed(2);
    inner = `
      <div class="modal-head"><h3>Checkout — escrow protected</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;">
        <div style="width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--paper-dim);"><img src="${p.img}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
        <div><div style="font-weight:600;font-size:13.5px;">${esc(p.title)}</div><div style="font-size:12px;color:var(--slate);">Sold by ${p.seller}</div></div>
      </div>
      <div class="field"><label>Shipping address</label><textarea>House 12, Street 4, Bahria Town, Rawalpindi, Punjab</textarea></div>
      <div class="field"><label>Payment method</label><select><option>Visa •••• 4471</option><option>Mastercard •••• 8823</option></select></div>
      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>Item price</span><span class="mono">${fmt(p.price)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--slate);"><span>Platform commission (${commissionRate}%)</span><span class="mono">${fmt(commission)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-top:8px;"><span>Total charged</span><span class="mono">${fmt(p.price)}</span></div>
      <div style="font-size:11.5px;color:var(--slate);margin:10px 0 16px;">${ic('shield',12)} Your payment is held securely in escrow and only released to the seller once you confirm delivery.</div>
      <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="confirmCheckout(${p.id})">${ic('lock',15)} Pay ${fmt(p.price)} into escrow</button>
    `;
  } else if(m.type==='dispute'){
    inner = `
      <div class="modal-head"><h3>Open a dispute</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div class="field"><label>What went wrong?</label><textarea id="disputeReason" placeholder="Describe the issue in detail — our team will review the evidence from both parties."></textarea></div>
      <div class="field"><label>Attach evidence (optional)</label><div class="upload-box">${ic('upload',20)}<div>Drop photos or drag files here</div></div></div>
      <button class="btn btn-coral" style="width:100%;justify-content:center;" onclick="fileDispute('${m.orderId}', document.getElementById('disputeReason').value)">${ic('gavel',15)} Submit dispute</button>
    `;
  } else if(m.type==='payout'){
    inner = `
      <div class="modal-head"><h3>Withdraw funds</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div class="field"><label>Amount</label><input type="text" value="${fmt(CURRENT_USER.walletBalance)}" disabled></div>
      <div class="field"><label>Payout to</label><select><option>Bank account •••• 2291</option></select></div>
      <div style="font-size:11.5px;color:var(--slate);margin-bottom:16px;">${ic('info',12)} Payouts typically arrive within 2–3 business days.</div>
      <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="requestPayout()">Confirm withdrawal</button>
    `;
  } else if(m.type==='review'){
    inner = `
      <div class="modal-head"><h3>Leave a review</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div class="field"><label>Rating</label>
        <div class="star-row" id="starRow">
          ${[1,2,3,4,5].map(i=>`<span onclick="state.modal.rating=${i};renderModal();" style="color:${i<=(state.modal.rating||0)?'var(--gold)':'var(--line)'};">${ic('star',24)}</span>`).join('')}
        </div>
      </div>
      <div class="field"><label>Your review</label><textarea id="reviewText" placeholder="How was your experience with this transaction?"></textarea></div>
      <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="submitReview('${m.orderId}', state.modal.rating, document.getElementById('reviewText').value)">Submit review</button>
    `;
  } else if(m.type==='listing'){
    inner = `
      <div class="modal-head"><h3>Create a listing</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div class="field"><label>Title</label><input type="text" id="lTitle" placeholder="e.g. Vintage record player"></div>
      <div class="form-row2">
        <div class="field"><label>Price (USD)</label><input type="number" id="lPrice" placeholder="0.00"></div>
        <div class="field"><label>Condition</label><select id="lCond"><option>New</option><option selected>Used - Excellent</option><option>Used - Good</option><option>Used - Fair</option></select></div>
      </div>
      <div class="form-row2">
        <div class="field"><label>Category</label><select id="lCat"><option>Electronics</option><option>Fashion</option><option>Home & Living</option><option>Collectibles</option><option>Sports</option></select></div>
        <div class="field"><label>Stock</label><input type="number" id="lStock" value="1"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="lDesc" placeholder="Describe the item's condition, specifications and history…"></textarea></div>
      <div class="field"><label>Photos</label><div class="upload-box">${ic('image',20)}<div>Drag images here or click to upload</div></div></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="publishListing(collectListingForm(),'draft')">Save as draft</button>
        <button class="btn btn-gold" style="flex:1;justify-content:center;" onclick="publishListing(collectListingForm(),'active')">Publish listing</button>
      </div>
    `;
  } else if(m.type==='coupon'){
    inner = `
      <div class="modal-head"><h3>New coupon</h3><button class="modal-close" onclick="closeModal()">${ic('x',18)}</button></div>
      <div class="field"><label>Coupon code</label><input type="text" id="cCode" placeholder="e.g. SUMMER20"></div>
      <div class="field"><label>Discount type</label><input type="text" id="cType" placeholder="e.g. 20% off first order"></div>
      <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="addCoupon(document.getElementById('cCode').value, document.getElementById('cType').value)">Create coupon</button>
    `;
  }
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal();"><div class="modal">${inner}</div></div>`;
}
function collectListingForm(){
  return {
    title: document.getElementById('lTitle').value,
    price: document.getElementById('lPrice').value,
    condition: document.getElementById('lCond').value,
    category: document.getElementById('lCat').value,
    stock: document.getElementById('lStock').value,
    desc: document.getElementById('lDesc').value
  };
}

/* =========================================================
   MAIN RENDER
========================================================= */
function renderContentOnly(){
  const c = document.getElementById('content');
  const views = {
    browse: viewBrowse, product: viewProductDetail, offers: viewOffers, messages: viewMessages,
    orders: viewOrders, wallet: viewWallet, notifications: viewNotifications, profile: viewProfile,
    mylistings: viewMyListings, admin: viewAdmin
  };
  c.innerHTML = (views[state.view]||viewBrowse)();
  const cb = document.getElementById('chatBody'); if(cb) cb.scrollTop = cb.scrollHeight;
  const si = document.querySelector('.searchbar input'); if(si) si.focus({preventScroll:true});
}
function render(){
  renderSidebar();
  renderTopbar();
  renderContentOnly();
  renderModal();
}
state._offersTab='received';
render();
</script>
</body>
</html>
